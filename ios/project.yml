name: OnePercent
options:
  bundleIdPrefix: com.arshdeep
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    DEVELOPMENT_TEAM: 488UBAK37W
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  OnePercent:
    type: application
    platform: iOS
    sources:
      - OnePercent
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arshdeep.onepercent
        PRODUCT_NAME: One Percent
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: One Percent
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        TARGETED_DEVICE_FAMILY: "1"
        # The body analyses run tens of thousands of permutation shuffles;
        # unoptimised they take minutes. Optimise debug builds too.
        SWIFT_OPTIMIZATION_LEVEL: "-O"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    entitlements:
      path: OnePercent/OnePercent.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    info:
      path: OnePercent/Info.plist
      properties:
        NSHealthShareUsageDescription: One Percent reads your sleep, heart rate, HRV, steps and workouts to show what your body recorded, and to test whether your habits show up in it. It never writes to Health.
        # Flip to true once Apple grants the Private Cloud Compute entitlement
        # and it's added to the target — until then the on-device model answers.
        OPUsePrivateCloudCompute: false
  OnePercentTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - OnePercentTests
    dependencies:
      - target: OnePercent
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.arshdeep.onepercent.tests
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/One Percent.app/One Percent
schemes:
  OnePercent:
    build:
      targets:
        OnePercent: all
        OnePercentTests: [test]
    test:
      targets:
        - OnePercentTests
